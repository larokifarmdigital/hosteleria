# Los secrets (DATABASE_URL, SESSION_SECRET, R2_*, CRON_SECRET, etc.) se setean
# con `wrangler secret put NOMBRE`; no van aquí.

name = "hostelery-api"
main = "src/index.ts"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

[vars]
R2_BUCKET = "hostelery"
R2_PUBLIC_URL = "https://pub-9d86f2d0333e47b099554fddec4fddfd.r2.dev"
# Lista coma-separada de origins permitidos:
#  - localhost:4400 → backoffice en dev
#  - workers.dev    → Scalar /docs llamando a sí mismo
#  - studio.*       → futuro backoffice en prod (cuando lo deployes)
ALLOWED_ORIGIN = "http://localhost:4400,https://hostelery-api.larokifarmdigital.workers.dev,https://studio.hosteleria.cat"
SENTRY_ENV = "production"
EMAIL_FROM = "Hosteleria Studio <no-reply@hosteleria.cat>"
APP_URL = "http://localhost:4400"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hostelery"
# Solo afecta a `wrangler dev`: usa el bucket real en vez de uno simulado en
# disco. El navegador sube con URL firmada al bucket real, así que con el
# simulado `confirm` nunca encontraría el archivo.
remote = true

# `scheduled` en src/index.ts compara `event.cron` con estas cadenas exactas.
[triggers]
crons = [
  "0 4 * * *",  # Cleanup sesiones expiradas + rate_limits viejos
  "0 3 * * *"   # Backup diario de BD a R2
]
